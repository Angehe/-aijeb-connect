<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIJEB Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
      text-align: center;
    }

    .logo {
      max-width: 120px;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #173f73;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="card" id="loginBox">
    <img src="logo-aijeb.png.png" class="logo" alt="AIJEB">

    <h1>AIJEB Connect</h1>

    <p>
      Entrez votre adresse e-mail.
      Nous vous enverrons un lien de connexion sécurisé.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Votre adresse e-mail"
      value="angeherved@gmail.com"
    >

    <button id="sendLink">
      Recevoir mon lien de connexion
    </button>

    <div id="message"></div>
  </div>


 <div class="card hidden" id="connectedBox">
  <img src="logo-aijeb.png.png" class="logo" alt="AIJEB">

  <h1>Tableau de bord AIJEB</h1>

  <p>Bienvenue dans votre espace de gestion.</p>

  <div>
    <p><strong>Membres</strong></p>
    <p><strong>Adhésions</strong></p>
    <p><strong>Cotisations</strong></p>
    <p><strong>Finances</strong></p>
    <p><strong>Activités</strong></p>
    <p><strong>Projets</strong></p>
    <p><strong>Partenaires</strong></p>
    <p><strong>Galerie photos</strong></p>
  </div>

  <button id="logout">
    Se déconnecter
  </button>
</div>


<script>
  const SUPABASE_URL = 'https://davftivuspiigcbshsuo.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_nTZ62Z5W5ALjxfEnkiW8KA_ADh_hHCg';

  const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  const emailInput = document.getElementById('email');
  const message = document.getElementById('message');
  const loginBox = document.getElementById('loginBox');
  const connectedBox = document.getElementById('connectedBox');


  async function showSession() {
    const {
      data: { session }
    } = await sb.auth.getSession();

    if (session) {
      loginBox.classList.add('hidden');
      connectedBox.classList.remove('hidden');
    }
  }


  document.getElementById('sendLink').onclick = async function () {

    const email = emailInput.value.trim();

    if (!email) {
      message.textContent = 'Veuillez entrer votre adresse e-mail.';
      return;
    }

    message.textContent = 'Envoi du lien en cours...';

    const { error } = await sb.auth.signInWithOtp({
      email: email,
      options: {
        shouldCreateUser: false,
        emailRedirectTo: 'https://angehe.github.io/-aijeb-connect/'
      }
    });

    if (error) {
      message.textContent = 'Erreur : ' + error.message;
      return;
    }

    message.textContent =
      'Lien envoyé. Consultez votre boîte e-mail.';
  };


  document.getElementById('logout').onclick = async function () {
    await sb.auth.signOut();
    window.location.reload();
  };


  sb.auth.onAuthStateChange(function(event, session) {

    if (session) {
      loginBox.classList.add('hidden');
      connectedBox.classList.remove('hidden');
    }

  });


  showSession();
</script>

</body>
</html>
